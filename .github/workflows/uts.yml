# Satu workflow untuk dua peran:
# - Di repo induk (mh4Scripts/uts-paw): build portal/ dan tayangkan di domain ujian.
# - Di fork mahasiswa: build app/, tayangkan di USERNAME.github.io/uts-paw, lalu cek rubrik.
# Mahasiswa tidak perlu mengubah berkas ini.
name: Build dan Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Memperbarui halaman Pengumpulan (hanya di repo induk). Jadwal GitHub tidak dijamin tepat
    # waktu dan sering dilewati saat ramai, jadi dibuat rapat; portal juga membaca daftar fork
    # langsung dari API GitHub sehingga fork baru tetap muncul di antara dua jadwal.
    - cron: '7,27,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || github.repository == 'mh4Scripts/uts-paw'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            portal/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      - name: Pilih folder yang dibangun
        run: |
          if [ "$GITHUB_REPOSITORY" = "mh4Scripts/uts-paw" ]; then
            echo "TARGET=portal" >> "$GITHUB_ENV"
          else
            echo "TARGET=app" >> "$GITHUB_ENV"
          fi

      - name: Kumpulkan daftar fork
        if: env.TARGET == 'portal'
        env:
          GH_TOKEN: ${{ github.token }}
          # Secret berisi NIM, nama, dan kelas; tidak pernah ditulis ke repo.
          DAFTAR_KELAS: ${{ secrets.DAFTAR_KELAS }}
        run: node grader/kumpulkan.mjs > portal/public/pengumpulan.json

      - name: Pasang dependensi
        working-directory: ${{ env.TARGET }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.TARGET }}
        env:
          # "" untuk domain sendiri, "/uts-paw" untuk USERNAME.github.io/uts-paw
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Fallback 404.html untuk React Router
        run: cp "$TARGET/dist/index.html" "$TARGET/dist/404.html"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.TARGET }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  cek:
    needs: deploy
    if: github.repository != 'mh4Scripts/uts-paw'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Pasang dependensi
        working-directory: app
        run: npm ci

      - name: Cek rubrik (hasil ada di Summary)
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node grader/periksa.mjs --lokal app --url "$PAGE_URL"
